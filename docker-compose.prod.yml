# Kiselgram production stack — runs on 79.133.183.249 (new main server).
# DB stays hosted on the old server kiselgram.ru 155.212.247.190:5433.

services:
  app:
    image: kiselgram-app:latest
    command: gunicorn wsgi:app -b 0.0.0.0:5000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - uploads:/app/uploads
      - instance:/app/instance
      - ./config/kis.toml:/app/config/kis.toml:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - VIDEO_HOST=video
      - VIDEO_PORT=5001
      - VIDEO_EXTERNAL_URL=https://web.kiselgram.ru
      - MAILADMIN_INTERNAL_KEY=${MAILADMIN_INTERNAL_KEY}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  video:
    image: kiselgram-app:latest
    command: python video_server/app.py
    volumes:
      - ./config/kis.toml:/app/config/kis.toml:ro
    environment:
      - VIDEO_PORT=5001
      - VIDEO_HOST=0.0.0.0
      - VIDEO_PRODUCTION=1
      - DATABASE_URL=${DATABASE_URL}
      - VIDEO_EXTERNAL_URL=https://video.kiselgram.ru
      - PYTHONUNBUFFERED=1
      - MAILADMIN_INTERNAL_KEY=${MAILADMIN_INTERNAL_KEY}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0
    hostname: mail.kiselgram.ru
    ports:
      # SMTP
      - "25:25"
      - "465:465"
      - "587:587"
      # IMAP/POP3 re-enabled as part of the new-server switchover
      - "110:110"
      - "143:143"
      - "993:993"
      - "995:995"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./mailserver/config:/tmp/docker-mailserver
      - ./ssl/mail:/etc/ssl/mail:ro
    env_file: ./mailserver/mailserver.env
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailadmin:
    image: kiselgram-mailadmin:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mailserver/config:/mailconfig:rw
    environment:
      MAILADMIN_SECRET: "${MAILADMIN_SECRET}"
      MAILADMIN_ADMINS: "${MAILADMIN_ADMINS:-postmaster@kiselgram.ru,postmaster@mail.kiselgram.ru}"
      MAILADMIN_DOMAINS: "${MAILADMIN_DOMAINS:-kiselgram.ru,mail.kiselgram.ru}"
      MAILADMIN_INTERNAL_KEY: "${MAILADMIN_INTERNAL_KEY}"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot
      - ./docs:/var/www/docs:ro
      - ./desktop-site:/var/www/desktop:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - app
      - video
      - mailadmin
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  uploads:
  instance:
  maildata:
  mailstate: